# GitHub Actions Workflow - Daily Metrics
name: Daily Metrics Update
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:  
  # push:
  #   branches: [ master, main ]

permissions:
  contents: write

jobs:
  update-metrics:
    name: Atualizar Métricas Diárias    
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        with:
          cache: 'pip'
      
      - name: 🚀 Run daily metrics script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python src/scripts/daily_metrics.py
      
      - name: 💾 Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.json README.md assets/*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Update daily metrics [skip ci]"
          git push
      
      - name: 📊 Create job summary
        if: always()
        run: |
          echo "## 📊 Daily Metrics Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Execução concluída!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 Data: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show last lines of metrics.json
          if [ -f data/metrics.json ]; then
            echo "### Métricas Atualizadas" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/metrics.json | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi