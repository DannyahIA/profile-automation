name: 🚀 Update GitHub Profile

on:
  schedule:
    # Executa a cada hora
    - cron: '0 * * * *'
  workflow_dispatch:  # Permite execução manual
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'themes/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    name: 📊 Atualizar Perfil GitHub
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📊 Coletar dados do GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "🔍 Coletando dados para: $GITHUB_USERNAME"
          echo "📦 Repositório: $GITHUB_REPOSITORY"
          python src/scripts/daily_metrics.py
      
      - name: 🎨 Gerar gráficos SVG
        run: |
          echo "🎨 Gerando gráficos SVG..."
          python src/scripts/generate_complete_dashboard.py
      
      - name: 📝 Atualizar README
        run: |
          echo "📝 Atualizando timestamp do README..."
          sed -i "s|<!-- AUTO-GENERATED:START (last_update) -->.*<!-- AUTO-GENERATED:END -->|<!-- AUTO-GENERATED:START (last_update) -->$(date +%Y-%m-%d)<!-- AUTO-GENERATED:END -->|g" README.md 2>/dev/null || true
      
      - name: 💾 Commit e Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adicionar todos os arquivos gerados
          git add assets/*.svg 2>/dev/null || true
          git add data/*.json 2>/dev/null || true
          git add README.md 2>/dev/null || true
          
          # Verificar se há mudanças
          if git diff --staged --quiet; then
            echo "✅ Nenhuma mudança para commitar"
          else
            git commit -m "🤖 Auto-update: Métricas e gráficos [$(date +'%Y-%m-%d %H:%M:%S')] [skip ci]" \
              -m "📊 Métricas atualizadas" \
              -m "🎨 Gráficos SVG regenerados" \
              -m "" \
              -m "Gerado por GitHub Actions"
            
            git push
            echo "✅ Mudanças enviadas com sucesso!"
          fi
      
      - name: 📊 Resumo da execução
        if: always()
        run: |
          echo "## 📊 Resumo da Atualização do Perfil" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕒 **Horário:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **Usuário:** ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Repositório:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Status:** Concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📁 Arquivos Gerados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📊 SVGs:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh assets/*.svg 2>/dev/null | tail -n +2 | awk '{print $9, "(" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "Nenhum SVG encontrado" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 📄 JSONs:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh data/*.json 2>/dev/null | tail -n +2 | awk '{print $9, "(" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "Nenhum JSON encontrado" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Mostrar preview das métricas
          if [ -f data/metrics.json ]; then
            echo "### 📈 Preview das Métricas" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat data/metrics.json | jq '{username, total_commits, total_repos, total_prs, total_stars, last_updated}' 2>/dev/null >> $GITHUB_STEP_SUMMARY || cat data/metrics.json | head -15 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 🎉 Sucesso
        if: success()
        run: |
          echo "✨ Atualização do perfil concluída com sucesso!"
          echo "📊 Métricas coletadas e gráficos gerados."
          echo "🚀 Todas as mudanças foram commitadas."
