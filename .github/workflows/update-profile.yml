name: 🚀 Update GitHub Profile

on:
  schedule:
    # Roda todo dia às 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite execução manual
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'themes/**'
      - '.github/workflows/**'

jobs:
  update-profile:
    runs-on: ubuntu-latest
    name: 📊 Generate Profile Charts
    
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 📊 Collect GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          echo "🔍 Collecting data for user: $GITHUB_ACTOR"
          python src/scripts/daily_metrics.py
      
      - name: 🎨 Generate SVG Charts
        run: |
          echo "🎨 Generating SVG charts..."
          python src/scripts/generate_complete_dashboard.py
      
      - name: 📝 Update README
        run: |
          echo "📝 Updating README timestamp..."
          sed -i "s|<!-- AUTO-GENERATED:START (last_update) -->.*<!-- AUTO-GENERATED:END -->|<!-- AUTO-GENERATED:START (last_update) -->$(date +%Y-%m-%d)<!-- AUTO-GENERATED:END -->|g" README.md
      
      - name: 🔍 Check for Changes
        id: git-check
        run: |
          git diff --exit-code assets/ data/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: 💾 Commit and Push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add assets/*.svg
          git add data/*.json
          git add README.md
          
          git commit -m "🤖 Auto-update: GitHub profile stats [$(date +'%Y-%m-%d %H:%M:%S')]" \
            -m "📊 Updated metrics and charts" \
            -m "🎨 Generated new visualizations" \
            -m "" \
            -m "Generated by GitHub Actions" || exit 0
          
          git push
      
      - name: 📊 Summary
        if: always()
        run: |
          echo "## 📊 Profile Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🕒 **Update Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **User:** ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🎨 **Charts Generated:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 **Status:** Profile updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh assets/*.svg 2>/dev/null | tail -n +2 | awk '{print $9, "(" $5 ")"}' >> $GITHUB_STEP_SUMMARY || echo "No SVG files found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎉 Success Notification
        if: success()
        run: |
          echo "✨ Profile update completed successfully!"
          echo "📊 All charts have been generated and committed."
          echo "🚀 Your profile is now up to date!"
