<svg width="1200" height="650" xmlns="http://www.w3.org/2000/svg">
    <style>
        * { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        }
        text { fill: #e6edf3; }
        .title { 
            font-size: 24px; 
            font-weight: 700; 
            fill: #58a6ff; 
        }
        .subtitle { 
            font-size: 14px; 
            fill: #8b949e; 
        }
        .entry-title {
            font-size: 15px;
            font-weight: 600;
            fill: #e6edf3;
        }
        .entry-company {
            font-size: 13px;
            font-weight: 500;
        }
        .entry-date {
            font-size: 11px;
            fill: #8b949e;
        }
        .entry-desc {
            font-size: 11px;
            fill: #6e7681;
        }
        .label-small {
            font-size: 9px;
            fill: #8b949e;
        }
        .tech-badge {
            font-size: 9px;
            font-weight: 600;
            fill: #58a6ff;
        }
        .timeline-line {
            stroke: #30363d;
            stroke-width: 3;
        }
        .timeline-dot {
            fill: #58a6ff;
        }
        .timeline-dot-work {
            fill: #3fb950;
        }
        .timeline-dot-education {
            fill: #a371f7;
        }
        .timeline-dot-current {
            fill: #d29922;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animated { animation: fadeIn 0.6s ease-out; }
        .slide-in { animation: slideIn 0.5s ease-out; }
        .pulse { animation: pulse 2s ease-in-out infinite; }
        .cert-badge {
            font-size: 11px;
            font-weight: 600;
        }
        </style>
