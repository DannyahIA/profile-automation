<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
<rect width="800" height="320" fill="#191724" rx="10"/>
<text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
📊 Daily Activity Comparison
</text>
<rect x="50" y="50" width="200" height="100" fill="#1F1D2E" rx="8" stroke="#EB6F92" stroke-width="2"/>
<text x="150" y="75" font-family="Arial, sans-serif" font-size="14" fill="#6E6A86" text-anchor="middle">Today</text>
<text x="150" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">15</text>
<text x="150" y="135" font-family="Arial, sans-serif" font-size="12" fill="#6E6A86" text-anchor="middle">commits</text>
<rect x="280" y="50" width="200" height="100" fill="#1F1D2E" rx="8"/>
<text x="380" y="75" font-family="Arial, sans-serif" font-size="14" fill="#6E6A86" text-anchor="middle">Average</text>
<text x="380" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#9CCFD8" text-anchor="middle">8.5</text>
<text x="380" y="135" font-family="Arial, sans-serif" font-size="12" fill="#6E6A86" text-anchor="middle">commits/day</text>
<rect x="510" y="50" width="240" height="100" fill="#1F1D2E" rx="8"/>
<text x="630" y="75" font-family="Arial, sans-serif" font-size="14" fill="#6E6A86" text-anchor="middle">Change</text>
<text x="630" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#31748F" text-anchor="middle">↑ 76%</text>
<text x="630" y="135" font-family="Arial, sans-serif" font-size="12" fill="#6E6A86" text-anchor="middle">vs average</text>
<text x="400" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Last 7 Days</text>
<rect x="60" y="268.0" width="80" height="12.0" fill="#9CCFD8" rx="4" opacity="0.8">
<animate attributeName="height" from="0" to="12.0" dur="0.5s" fill="freeze"/>
<animate attributeName="y" from="280" to="268.0" dur="0.5s" fill="freeze"/>
</rect>
<text x="100.0" y="263.0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>
<text x="100.0" y="300" font-family="Arial, sans-serif" font-size="10" fill="#6E6A86" text-anchor="middle">12-27</text>
<rect x="160" y="190.0" width="80" height="90.0" fill="#EB6F92" rx="4" opacity="0.8">
<animate attributeName="height" from="0" to="90.0" dur="0.5s" fill="freeze"/>
<animate attributeName="y" from="280" to="190.0" dur="0.5s" fill="freeze"/>
</rect>
<text x="200.0" y="185.0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">15</text>
<text x="200.0" y="300" font-family="Arial, sans-serif" font-size="10" fill="#6E6A86" text-anchor="middle">01-26</text>
</svg>