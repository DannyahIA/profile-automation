<svg width="1200" height="550" xmlns="http://www.w3.org/2000/svg">
    <style>
        
        * { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        }
        text { fill: #e6edf3; }
        .title { 
            font-size: 20px; 
            font-weight: 600; 
            fill: #58a6ff; 
        }
        .subtitle { 
            font-size: 14px; 
            font-weight: 500; 
            fill: #8b949e; 
        }
        .value { font-size: 28px; font-weight: 700; }
        .value-large { font-size: 36px; font-weight: 700; }
        .label { font-size: 12px; opacity: 0.7; }
        .label-small { font-size: 10px; opacity: 0.6; }
        .badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-change {
            font-size: 13px;
            font-weight: 600;
        }
        .trend-up { fill: #3fb950; }
        .trend-down { fill: #f85149; }
        .trend-neutral { fill: #8b949e; }
        
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 3px currentColor); }
            50% { filter: drop-shadow(0 0 8px currentColor); }
        }
        .animated { animation: fadeIn 0.6s ease-out; }
        .slide-up { animation: slideUp 0.5s ease-out; }
        .scale-in { animation: scaleIn 0.4s ease-out; }
        .pulse { animation: pulse 2s ease-in-out infinite; }
        .glow { animation: glow 2s ease-in-out infinite; }
        
    </style>
    <rect class="scale-in" width="1200" height="550" fill="#161b22" rx="12"/>
    <text class="title animated" x="24" y="40"></text>
    <text class="subtitle animated" x="24" y="65" style="animation-delay: 0.1s">Showcasing dedication and innovation • Updated January 29, 2026</text>
    <g class="fade-in">
    <text class="title" x="40" y="45">🚀 Featured Projects</text>
    <text class="label" x="40" y="70">My most significant repositories and contributions</text>
</g>
